<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan-Séquence v23</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--p:#fff;--ink:#0d1b2a;--dim:#6b7c93;--ln:#d3dce8;--a:#0a84ff;--b:#ff5a1f;--ok:#12b76a;--er:#e5383b;--m:'Share Tech Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 Rajdhani,system-ui,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:80px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/36px 36px;opacity:.45}
.w{max-width:1080px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
h1{font-size:34px;font-weight:300;letter-spacing:.04em;text-transform:uppercase}h1 b{font-weight:700;color:var(--a)}
.lab{font:11px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pn{background:var(--p);border:1px solid var(--ln);padding:16px;margin-bottom:14px;position:relative}
.pn::before,.pn::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--a)}
.pn::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.pn::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.row{grid-template-columns:1fr}h1{font-size:24px}}
textarea,select{width:100%;font:13px var(--m);padding:9px;border:1px solid var(--ln);background:#f9fbfd;color:var(--ink);outline:0}
textarea:focus,select:focus{border-color:var(--a)}textarea{height:92px;resize:vertical;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{font:11px var(--m);padding:2px 7px;border:1px solid var(--ok);color:var(--ok)}
.chip.off{border-color:var(--er);color:var(--er)}.chip.cd{border-color:var(--b);color:var(--b)}
.drop{display:flex;align-items:center;justify-content:center;gap:12px;border:1px dashed var(--a);min-height:130px;cursor:pointer;font:12px var(--m);color:var(--a);text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-top:6px}
.drop img{max-height:120px;max-width:100%}.drop:hover{background:#eef6ff}
button{font:600 13px var(--m);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--ink);background:var(--p);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:var(--ink);color:#fff}button:disabled{opacity:.35;cursor:not-allowed}
#go{width:100%;padding:20px;font-size:18px;background:var(--a);border-color:var(--a);color:#fff;letter-spacing:.2em}#go:hover:not(:disabled){background:#005fcc;border-color:#005fcc}
#stop{display:none;width:100%;margin-top:8px;border-color:var(--er);color:var(--er)}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 8px}.kp div{border:1px solid var(--ln);padding:6px 8px}.kp b{display:block;font:22px var(--m);font-weight:400}
.pg{height:4px;background:var(--ln)}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cd{border:1px solid var(--ln);background:var(--p);display:flex;flex-direction:column}.cd.ok{border-color:var(--ok)}.cd.run{border-color:var(--a)}.cd.er{border-color:var(--er);cursor:pointer}
.th{position:relative;aspect-ratio:9/16;background:#e6ecf4;overflow:hidden}.th img,.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tg{position:absolute;top:4px;left:4px;z-index:2;font:10px var(--m);background:var(--ink);color:#fff;padding:1px 5px}
.ov{position:absolute;left:0;right:0;bottom:0;z-index:2;font:11px var(--m);padding:4px 6px;background:rgba(255,255,255,.85)}.ov:empty{display:none}
.tx{font-size:13px;padding:6px 8px;line-height:1.3}.mt{font:10px var(--m);color:var(--dim);padding:0 8px 7px}
#ctog{position:fixed;right:14px;bottom:14px;z-index:60;background:var(--ink);color:#fff;padding:12px 16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#ctog b{background:var(--er);padding:0 6px;margin-left:6px;display:none}
#con{position:fixed;left:0;right:0;bottom:0;height:38vh;z-index:50;background:#0d1b2a;color:#bfe3ff;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#con.on{transform:none}body.con #ctog{bottom:calc(38vh + 12px)}
.ch{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #26405c;font:12px var(--m)}.ch button{padding:3px 9px;font-size:11px;background:0;color:#bfe3ff;border-color:#4a6a8a;margin-left:6px}
#lb{flex:1;overflow:auto;padding:8px 12px;font:12px/1.5 var(--m)}.lg.er{color:#ff8a8a}.lg.wr{color:#ffc477}.lg.ok{color:#7dffb5}
#pl{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}#pl.on{display:flex}
#pv{max-width:100vw;max-height:100vh}#sub{position:absolute;left:5%;right:5%;bottom:7%;text-align:center;color:#fff;font:600 20px/1.3 Rajdhani;text-shadow:0 2px 8px #000}
#pl button{position:absolute;top:14px;right:14px;background:#fff}
</style></head><body>
<div class="w">
<header><div><div class="lab">Studio // actualités en plan-séquence</div><h1>Plan<b>-Séquence</b></h1></div><div class="lab">v23 · Agnes 2.5 · multi-clés</div></header>

<div class="row">
<div class="pn"><div class="lab">01 · Clés API Agnes (une par ligne)</div>
<textarea id="keys" spellcheck="false" placeholder="sk-...&#10;sk-..."></textarea>
<select id="plan"><option value="plan">Type de clé : Token Plan (payante)</option><option value="ent">Type de clé : Entreprise vérifiée</option><option value="free">Type de clé : Gratuite</option></select>
<div class="chips" id="kl"></div></div>
<div class="pn"><div class="lab">02 · Votre photo</div>
<label class="drop" id="drop"><span id="dt">+ Charger une photo</span><input type="file" id="file" accept="image/*" hidden></label></div>
</div>

<div class="pn"><button id="go">▶ Lancer la création complète</button><button id="stop">■ Arrêter</button>
<div class="kp"><div><span class="lab">Images</span><b id="k1">0/25</b></div><div><span class="lab">Vidéos</span><b id="k2">0/24</b></div><div><span class="lab">En cours</span><b id="k3">0</b></div><div><span class="lab">Clés</span><b id="k4">0</b></div><div><span class="lab">Cadence</span><b id="k5">×1.0</b></div></div>
<div class="pg"><i id="bar"></i></div>
<div class="lab" style="margin-top:8px" id="ph">En attente</div></div>

<div class="pn"><div class="lab" style="margin-bottom:8px">03 · Storyboard (clic sur une carte rouge = relancer la vidéo)</div><div id="grid"><div class="lab">Le scénario apparaîtra ici.</div></div>
<div style="margin-top:12px"><button id="pbtn" disabled>▶ Diffuser le film</button> <label class="lab"><input type="checkbox" id="tts" checked> voix française</label></div></div>
</div>

<button id="ctog">▲ Ouvrir la console <b id="lc">0</b></button>
<div id="con"><div class="ch"><span>CONSOLE</span><span><button id="cpy">Copier</button><button id="cx">✕ Fermer</button></span></div><div id="lb"></div></div>
<div id="pl"><video id="pv" playsinline></video><div id="sub"></div><button id="px">✕ Quitter</button></div>

<script>
const API='https://apihub.agnes-ai.com/v1',POLL='https://apihub.agnes-ai.com/agnesapi';
const M={txt:['agnes-3.0-flash','agnes-2.5-flash'],img:'agnes-image-2.5-flash',vid:'agnes-video-2.5-flash'};
const N=24,SEC='10',RPM={free:{img:10,vid:1,txt:10},ent:{img:40,vid:2,txt:20},plan:{img:100,vid:5,txt:600}};
const LBL={intro:'BONJOUR',news:'ACTU',reflect:'RÉFLEXION',outro:'AU REVOIR'};
const MOVES=['slow tai-chi flow with circular arms','contemporary dance spiral, arms sweeping','calm kung-fu form, controlled balance','meditative walk with open palms','fluid torso rotation, expressive hands','slow graceful kata, extended arms'];
const CAMS=['smooth lateral tracking shot to the right','slow dolly-in while the character walks right','slow arc around the character','slow crane down to eye level','gentle push-in following the walk','tracking shot with subtle tilt'];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t??'').replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[\u00a0\u202f]/g,' ');
const S={keys:[],run:false,stop:false,ref:null,an:null,news:[],script:null,frames:[],vids:[],vp:[],factor:1,ok:0,errs:0,logs:[]};
const T=i=>i==1?'intro':i==N?'outro':i%2==0?'news':'reflect';

/* ---------- console ---------- */
function log(l,m){const t=new Date().toLocaleTimeString('fr-FR')+'  '+m;S.logs.push(t);const d=document.createElement('div');d.className='lg '+l;d.textContent=t;const b=$('lb');b.appendChild(d);while(b.children.length>500)b.firstChild.remove();b.scrollTop=b.scrollHeight;if(l=='er'){S.errs++;$('lc').textContent=S.errs;$('lc').style.display='inline'}}
function tcon(f){const on=f==null?!$('con').classList.contains('on'):f;$('con').classList.toggle('on',on);document.body.classList.toggle('con',on);$('ctog').firstChild.textContent=on?'▼ Fermer la console ':'▲ Ouvrir la console ';try{localStorage.setItem('ps23_con',on?1:0)}catch(e){}}

/* ---------- clés + planificateur ---------- */
function parseKeys(){return [...new Set($('keys').value.split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>12))]}
function setKeys(){const ks=parseKeys();S.keys=ks.map(k=>S.keys.find(o=>o.k===k)||{k,img:0,vid:0,txt:0,cool:0,bad:0,off:false});try{localStorage.setItem('ps23_keys',ks.join('\n'));localStorage.setItem('ps23_plan',$('plan').value)}catch(e){}ui()}
/* Réserve le créneau le plus tôt disponible parmi toutes les clés : charge répartie, cadence respectée par clé */
async function slot(kind){
  for(;;){
    if(S.stop)throw new Error('stop');
    const live=S.keys.filter(o=>!o.off);if(!live.length)throw Object.assign(new Error('Aucune clé active'),{fatal:true});
    const iv=60000/RPM[$('plan').value][kind]*1.15*S.factor,now=Date.now();let best=null,bt=1e18;
    for(const o of live){const t=Math.max(o[kind],o.cool,now);if(t<bt){bt=t;best=o}}
    best[kind]=bt+iv;if(bt>now)await sleep(bt-now);
    if(S.stop)throw new Error('stop');if(best.cool>Date.now())continue;return best;
  }
}
async function call(kind,url,body,tries){
  let err;
  for(let a=0;a<tries;a++){
    const o=await slot(kind);
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+o.k},body:JSON.stringify(body)});
      if(r.ok){o.bad=0;if(S.factor>1&&++S.ok%8==0)S.factor=Math.max(1,S.factor*.85);return{r,o}}
      const tx=(await r.text()).slice(0,260);log('er',`${kind} #${S.keys.indexOf(o)+1} HTTP ${r.status} ${tx}`);
      if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||25)*1000;S.factor=Math.min(4,S.factor*1.5);err=new Error('429');continue}
      if([401,402,403].includes(r.status)){if(++o.bad>=2){o.off=true;log('wr','clé …'+o.k.slice(-4)+' désactivée')}err=new Error('HTTP '+r.status+' '+tx);continue}
      if(r.status>=500||r.status==408||r.status==409){err=new Error('HTTP '+r.status);await sleep(2000*2**a);continue}
      throw Object.assign(new Error('HTTP '+r.status+' '+tx),{fatal:true});
    }catch(e){if(e.fatal||e.message=='stop')throw e;err=e;await sleep(1500*(a+1))}
  }
  throw err||new Error('échec');
}

/* ---------- LLM ---------- */
const J=t=>{if(!t)return null;t=t.replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}};
async function chat(sys,user,max,temp,img){
  for(const m of M.txt){
    try{
      const c=img?[{type:'text',text:user},{type:'image_url',image_url:{url:img}}]:user;
      const{r}=await call('txt',API+'/chat/completions',{model:m,messages:[{role:'system',content:sys},{role:'user',content:c}],temperature:temp,max_tokens:max,chat_template_kwargs:{enable_thinking:false}},3);
      const d=await r.json(),t=d.choices?.[0]?.message?.content;if(t)return t;
    }catch(e){if(e.message=='stop')throw e;log('wr',`texte ${m} : ${e.message}`)}
  }
  throw new Error('LLM indisponible');
}
async function analyze(){
  const j=J(await chat('Directeur de casting. JSON strict uniquement.','Décris cette image. Réponds : {"character":"precise English physical description (face, hair, age, skin, clothing, colors)","medium":"precise English description of the medium and art style","live":true si c\'est une vraie photographie sinon false}',700,.2,S.ref));
  if(!j)throw new Error('JSON invalide');return{ch:String(j.character||'the person in the reference image'),md:String(j.medium||''),live:j.live!==false};
}
const clean=t=>{const d=document.createElement('textarea');d.innerHTML=String(t||'');return d.value.replace(/\s+-\s+[^-]{2,40}$/,'').trim()};
async function getNews(){
  let a=[];
  try{const r=await fetch('https://freenewsapi.ai/v1/search?'+new URLSearchParams({q:'actualité France',lang:'fr',country:'FR',date:'7d',sort:'relevance',size:'30'}));if(r.ok)a=((await r.json()).results||[]).map(x=>clean(x.title))}catch(e){log('wr','freenewsapi : '+e.message)}
  if(a.length<10)try{const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://news.google.com/rss?hl=fr&gl=FR&ceid=FR:fr'));a=a.concat(((await r.json()).items||[]).map(x=>clean(x.title)))}catch(e){log('wr','rss2json : '+e.message)}
  return[...new Set(a.filter(t=>t.length>15))].slice(0,30);
}
function scenPrompt(){
  const d=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `Tu écris le texte d'un journal parlé d'environ 4 minutes en 24 segments de 10 secondes, dits par UN personnage qui marche sans s'arrêter. Date : ${d}.
TITRES D'ACTUALITÉ (seule source autorisée ; n'invente aucun fait, chiffre, nom ni citation de personnalité) :
${S.news.map((t,i)=>(i+1)+'. '+t).join('\n')||'(aucun : reste général et prudent)'}
STRUCTURE (indices de 1 à 24) :
- 1 "intro" : "Bonjour", la date, et le fil conducteur du jour (une idée forte qui relie toutes les actus).
- 2,4,...,22 "news" : UN fait précis tiré d'un titre, reformulé simplement. Choisis 11 titres de sujets très différents (politique, sport, culture, économie, science, international...).
- 3,5,...,23 "reflect" : réflexion philosophique accessible qui prolonge le fait précédent ET amène naturellement le suivant. Pas de jargon. Parfois une citation RÉELLE et célèbre (Camus, Weil, Montaigne, Arendt...) dans "quote", sinon "". Jamais de citation dont tu n'es pas certain.
- 24 "outro" : reprend le fil conducteur, puis "Au revoir" et un souhait.
RÈGLES : "text" = français parlé naturel, 18 à 24 mots, sans emoji. "decor" = ANGLAIS, lieu coloré et précis qui ILLUSTRE le sujet du segment (football -> packed stadium at night under floodlights ; économie -> trading floor ; science -> glowing laboratory...), différent à chaque segment. "action" et "camera" en anglais. "topic" = 2-3 mots anglais.
Réponds UNIQUEMENT par ce JSON : {"title":"","thread":"","segments":[{"i":1,"type":"intro","topic":"","text":"","decor":"","action":"","camera":"","quote":""}]} avec exactement 24 segments.`;
}
async function scenario(){
  let j=null;
  for(let a=0;a<2&&!(j&&j.segments&&j.segments.length>=18);a++){try{j=J(await chat('Scénariste et journaliste rigoureux. JSON strict uniquement.',scenPrompt(),7000,.75))}catch(e){if(e.message=='stop')throw e;log('wr','scénario : '+e.message)}}
  const sg=j?.segments||[];if(sg.length<18)log('wr','scénario incomplet → texte de secours');
  const segs=Array.from({length:N},(_,k)=>{const s=sg.find(x=>+x.i==k+1)||sg[k]||{},ty=T(k+1);
    const dflt=ty=='intro'?'Bonjour, voici le journal du jour, et pour fil conducteur : comprendre ce qui nous traverse.':ty=='outro'?'Voilà pour aujourd\'hui. Merci de votre attention, au revoir et à très bientôt.':ty=='news'?clean(S.news[(k/2|0)%Math.max(1,S.news.length)]||'Une information marque cette journée.'):'Chaque événement nous invite à prendre un peu de recul pour mieux comprendre.';
    return{type:ty,topic:String(s.topic||'city'),text:String(s.text||dflt).trim(),decor:String(s.decor||'colorful city street at dusk'),action:String(s.action||MOVES[k%6]),camera:String(s.camera||CAMS[k%6]),quote:String(s.quote||'')}});
  return{title:j?.title||'Plan-Séquence',segs};
}

/* ---------- prompts ---------- */
function look(){const a=S.an;return `Same person as the reference image (identical face, hair, skin tone and outfit): ${a.ch}. `+(a.live?'Real photograph, natural light, subtle film grain.':'Keep exactly the medium and art style of the reference: '+a.md+'.')}
function imgPrompt(i){
  const s=S.script.segs[Math.max(0,i-1)],pose=i==0?'standing at the start of the walk, giving a small welcoming nod':i==N?'turning back with a gentle farewell wave while still stepping right':'caught mid-stride walking to the right, '+s.action;
  return san(`Vertical 9:16 cinematic film still. ${look()} Setting: ${s.decor}, rich colorful details that clearly illustrate the topic "${s.topic}". Pose: full-body three-quarter view, ${pose}, calm present expression, character in the right third of the frame and the setting extending to the left. Camera: ${s.camera}. No text, no logo, no watermark, no border.`);
}
function vidPrompt(i){
  const s=S.script.segs[i],p=S.script.segs[Math.max(0,i-1)];
  return san(`The person moves smoothly from the first-frame pose to the last-frame pose, walking calmly toward the right in one continuous take. Movement: ${s.action}. ${i>0?'The setting evolves naturally from '+p.decor+' to '+s.decor+'.':'Setting: '+s.decor+'.'} Camera: ${s.camera}. Natural ambience and footsteps only, no music, no speech, no on-screen text. Keep identity, outfit and visual style identical throughout.`);
}

/* ---------- images : toutes en parallèle depuis la photo ---------- */
async function genImg(i){
  for(let a=0;a<3;a++){
    try{
      const{r}=await call('img',API+'/images/generations',{model:M.img,prompt:imgPrompt(i),size:'1K',ratio:'9:16',extra_body:{image:[S.ref],response_format:'url'}},3);
      const u=(await r.json()).data?.[0]?.url;if(u)return u;throw new Error('pas d\'URL');
    }catch(e){if(e.message=='stop'||e.fatal)throw e;log('wr',`image ${i} essai ${a+1} : ${e.message}`)}
  }
  return null;
}
async function runFrames(){
  await Promise.all(S.frames.map(async(f,i)=>{f.st='run';ui();const t=Date.now();f.url=await genImg(i);f.st=f.url?'ok':'er';if(f.url)log('ok',`image ${i}/${N} prête (${Math.round((Date.now()-t)/1000)}s)`);ui();launch()}));
  const okI=S.frames.map((f,i)=>f.url?i:-1).filter(i=>i>=0);if(!S.frames[0].url)throw new Error('image de départ impossible');
  S.frames.forEach((f,i)=>{if(!f.url){const n=okI.reduce((b,x)=>Math.abs(x-i)<Math.abs(b-i)?x:b);f.url=S.frames[n].url;log('wr','image '+i+' remplacée par l\'image '+n)}});
  launch();
}

/* ---------- vidéos : lancées dès que début + fin sont prêtes ---------- */
function launch(){S.vids.forEach((v,i)=>{if(v.st=='wait'&&S.frames[i].url&&S.frames[i+1].url){v.st='run';v.msg='en file';S.vp.push(runVideo(i));ui()}})}
async function runVideo(i){
  const v=S.vids[i];
  for(let a=0;a<3;a++){
    try{
      v.msg=a?'relance '+a:'envoi…';ui();
      const{r,o}=await call('vid',API+'/videos',{model:M.vid,prompt:vidPrompt(i),seconds:SEC,mode:'keyframe',size:'720P',aspect_ratio:'9:16',first_frame:S.frames[i].url,last_frame:S.frames[i+1].url},4);
      const d=await r.json(),id=d.video_id||d.id;if(!id)throw new Error('pas de video_id');
      log('in',`vidéo ${i+1} envoyée (clé #${S.keys.indexOf(o)+1})`);const t=Date.now();
      v.url=await poll(id,o,v);v.st='ok';v.err='';log('ok',`vidéo ${i+1} prête (${Math.round((Date.now()-t)/1000)}s)`);ui();return;
    }catch(e){if(e.message=='stop'){v.st='wait';return}v.err=e.message.slice(0,60);log('wr',`vidéo ${i+1} essai ${a+1} : ${e.message}`);await sleep(3000)}
  }
  v.st='er';ui();
}
async function poll(id,o,v){
  const end=Date.now()+15*60000;let miss=0,iv=2500;
  while(Date.now()<end){
    if(S.stop)throw new Error('stop');await sleep(iv+Math.random()*600);
    try{
      const r=await fetch(POLL+'?video_id='+encodeURIComponent(id)+'&model_name='+M.vid,{headers:{Authorization:'Bearer '+o.k}});
      if(r.status==429){iv=Math.min(10000,iv*1.5);continue}
      if(r.status==404&&++miss<8)continue;
      if(!r.ok)throw Object.assign(new Error('suivi HTTP '+r.status),{fin:1});
      const d=await r.json();v.msg=(d.progress||0)+'%';ui();
      if(d.status=='completed'){if(d.url)return d.url;throw Object.assign(new Error('terminé sans URL'),{fin:1})}
      if(d.status=='failed')throw Object.assign(new Error(d.error?.message||'échec génération'),{fin:1});
    }catch(e){if(e.fin||e.message=='stop')throw e}
  }
  throw new Error('délai dépassé');
}

/* ---------- pipeline ---------- */
async function go(){
  if(S.run)return;setKeys();
  if(!S.keys.length)return log('er','Ajoutez au moins une clé API');if(!S.ref)return log('er','Ajoutez une photo');
  S.run=true;S.stop=false;S.vp=[];S.factor=1;S.keys.forEach(k=>{k.off=false;k.bad=0;k.cool=0;k.img=k.vid=k.txt=0});
  S.frames=Array.from({length:N+1},()=>({st:'wait',url:null}));S.vids=Array.from({length:N},()=>({st:'wait',url:null,msg:''}));
  $('go').disabled=true;$('stop').style.display='block';const t0=Date.now();
  try{
    $('ph').textContent='Analyse de la photo + collecte des actualités…';log('in','Départ : analyse + actualités en parallèle · '+S.keys.length+' clé(s)');
    const[an,nw]=await Promise.all([analyze().catch(e=>{log('wr','analyse : '+e.message);return{ch:'the person in the reference image',md:'',live:true}}),getNews()]);
    S.an=an;S.news=nw;log('ok',nw.length+' titres d\'actualité · '+(an.live?'photo réelle':'illustration'));
    $('ph').textContent='Écriture du scénario…';S.script=await scenario();log('ok','Scénario : '+S.script.title);
    $('grid').innerHTML=S.script.segs.map((s,i)=>`<div class="cd wait" id="c${i}"><div class="th"><img alt=""><span class="tg">${String(i+1).padStart(2,'0')} · ${LBL[s.type]}</span><div class="ov"></div></div><div class="tx">${esc(s.text)}</div><div class="mt">${esc(s.topic)}${s.quote?' · « '+esc(s.quote)+' »':''}</div></div>`).join('');
    $('ph').textContent='Images en parallèle → vidéos dès que chaque paire est prête…';ui();
    await runFrames();await Promise.all(S.vp);
    const ok=S.vids.filter(v=>v.st=='ok').length;$('ph').textContent=`Terminé : ${ok}/${N} vidéos en ${Math.round((Date.now()-t0)/1000)}s`;log('ok',$('ph').textContent);
  }catch(e){if(e.message=='stop'){$('ph').textContent='Arrêté';log('wr','Arrêt demandé')}else{$('ph').textContent='Erreur : '+e.message;log('er','Pipeline : '+e.message);tcon(true)}}
  S.run=false;S.stop=false;$('go').disabled=false;$('stop').style.display='none';ui();
}

/* ---------- affichage ---------- */
function ui(){if(ui.p)return;ui.p=1;requestAnimationFrame(()=>{ui.p=0;draw()})}
function draw(){
  const fi=S.frames.filter(f=>f.url).length,vo=S.vids.filter(v=>v.st=='ok').length,vr=S.vids.filter(v=>v.st=='run').length,now=Date.now();
  $('k1').textContent=fi+'/25';$('k2').textContent=vo+'/24';$('k3').textContent=vr;$('k4').textContent=S.keys.filter(k=>!k.off).length;$('k5').textContent='×'+S.factor.toFixed(1);
  $('bar').style.width=Math.min(100,(fi+vo*1.5)/61*100)+'%';$('pbtn').disabled=!vo||!!S.play;
  $('kl').innerHTML=S.keys.map((k,i)=>`<span class="chip ${k.off?'off':k.cool>now?'cd':''}">#${i+1} …${esc(k.k.slice(-4))} ${k.off?'OFF':k.cool>now?'PAUSE '+Math.ceil((k.cool-now)/1000)+'s':'OK'}</span>`).join('');
  S.vids.forEach((v,i)=>{
    const c=$('c'+i);if(!c)return;const f=S.frames[i+1],th=c.firstChild,im=th.querySelector('img'),ov=th.querySelector('.ov');
    if(f.url&&im.dataset.u!=f.url){im.src=f.url;im.dataset.u=f.url}
    c.className='cd '+v.st;ov.textContent=v.st=='ok'?'':v.st=='er'?'✕ '+(v.err||'échec')+' · relancer':v.st=='run'?v.msg:(S.frames[i].url&&f.url?'prête':'images…');
    if(v.st=='ok'&&!th.querySelector('video')){const vd=document.createElement('video');vd.src=v.url;vd.controls=true;vd.playsInline=true;vd.preload='metadata';th.appendChild(vd)}
  });
}
setInterval(()=>{if(S.keys.length)ui()},1000);

/* ---------- lecteur ---------- */
function speak(t){if(!$('tts').checked||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';const v=speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function stopPlay(){S.play=false;const v=$('pv');v.pause();v.removeAttribute('src');if('speechSynthesis' in window)speechSynthesis.cancel();$('pl').classList.remove('on');ui()}
async function play(){
  const L=S.vids.map((v,i)=>[v,i]).filter(x=>x[0].url);if(!L.length)return;S.play=true;$('pl').classList.add('on');const pv=$('pv');
  for(const[v,i]of L){if(!S.play)break;await new Promise(res=>{pv.src=v.url;$('sub').textContent=S.script.segs[i].text;pv.onended=res;pv.onerror=res;pv.play().catch(res);speak(S.script.segs[i].text)})}
  stopPlay();
}

/* ---------- init ---------- */
function resize(url,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(null);im.src=url})}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{S.ref=await resize(r.result,768);if(!S.ref)return log('er','Image illisible');$('drop').innerHTML='<img src="'+S.ref+'" alt="">';log('ok','Photo chargée : '+f.name)};r.readAsDataURL(f)};
$('go').onclick=go;$('stop').onclick=()=>{S.stop=true;if('speechSynthesis' in window)speechSynthesis.cancel()};
$('pbtn').onclick=play;$('px').onclick=stopPlay;document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.play)stopPlay()});
$('ctog').onclick=()=>tcon();$('cx').onclick=()=>tcon(false);
$('cpy').onclick=()=>{const t=S.logs.join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()})};
$('keys').oninput=setKeys;$('plan').onchange=setKeys;
$('grid').onclick=e=>{const c=e.target.closest('.cd.er');if(!c||S.stop)return;const i=+c.id.slice(1);S.vids[i].st='run';S.vids[i].msg='relance';S.vp.push(runVideo(i));ui()};
try{$('keys').value=localStorage.getItem('ps23_keys')||'';$('plan').value=localStorage.getItem('ps23_plan')||'plan';tcon(localStorage.getItem('ps23_con')=='1')}catch(e){}
setKeys();log('in','Plan-Séquence v23 prêt · modèles : '+M.img+' / '+M.vid);
</script></body></html>
